// build.gradle (Módulo: app)

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'org.sic4change.nut4health'
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.sic4change.nut4health"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 36
        versionName "1.30"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    flavorDimensions "nut4health"
    productFlavors {
        Development {
            dimension "nut4health"
        }
        Production {
            dimension "nut4health"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/{NOTICE,LICENSE}.txt'
            excludes += 'META-INF/services/javax.xml.stream.XMLEventFactory'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // DEPENDENCIAS ESTÁNDAR DE ANDROIDX Y MATERIAL DESIGN
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle (AndroidX)
    def lifecycle_version = "2.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Room (AndroidX)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-paging:2.6.1"

    // Firebase (BoM - Bill of Materials)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.hbb20:ccp:2.7.2'
    implementation "androidx.paging:paging-runtime:3.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.7.3" // versión compatible
    implementation "androidx.lifecycle:lifecycle-reactivestreams:2.7.0"

    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    implementation 'com.google.android.material:material:1.12.0'


    // Resto de librerías
    implementation 'com.github.imperiumlabs:GeoFirestore-Android:v1.5.0'
    implementation 'joda-time:joda-time:2.12.7'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation "com.airbnb.android:lottie:6.4.0"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.hbb20:ccp:2.7.3'
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation 'com.github.marlonlom:timeago:4.0.3'
    implementation 'com.github.psinetron:slycalendarview:0.0.9'
    implementation 'com.github.rezaiyan:arclayout:1.0.1'
    implementation 'com.github.GwonHyeok:StickySwitch:0.0.16'
    implementation 'com.github.hajiyevelnur92:intentanimation:1.0'

    // Worker
    implementation "androidx.work:work-runtime:2.9.0"

    // Apache POI for excel
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    implementation 'com.github.f0ris.sweetalert:library:1.6.2'


    // Módulos locales
    implementation project(':country_selector')
    implementation project(':animation_check')
    implementation project(':maplocationpicker')
    implementation project(':material-stepper')

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
